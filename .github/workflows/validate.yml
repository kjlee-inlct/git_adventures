name: Validate Git Adventures

on:
  push:
    branches:
      - "feature/**"
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check engine-conflicts.js
          node --check engine-release.js
          node --check engine-governance.js
          node --check assessment-scoring.js
          node --check engine-assessment.js
          node --check session-report.js
          node --check engine-session.js
          node --check report-aggregator.js
          node --check reports-ui.js
          node --check test-presets.js
          node --check facilitator.js
          node --check content/missions.js
          node --check content/missions-daily.js
          node --check content/missions-collaboration.js
          node --check content/missions-conflicts.js
          node --check content/missions-advanced.js
          node --check content/missions-release.js
          node --check content/missions-incidents.js
          node --check content/missions-governance.js
          node --check content/missions-assessment.js
          node --check tests/test-helpers.mjs
          node --check tests/golden.mjs
          node --check tests/alternate-solutions.mjs
          node --check tests/governance-invariants.mjs
          node --check tests/assessment.mjs
          node --check tests/assessment-scoring.mjs
          node --check tests/session-report.mjs
          node --check tests/report-aggregator.mjs
          node --check tests/test-presets.mjs
          node --check tests/command-coverage.mjs

      - name: Validate mission content
        run: node tests/content-smoke.mjs

      - name: Run mission golden tests
        run: node tests/golden.mjs

      - name: Run alternate solution tests
        run: node tests/alternate-solutions.mjs

      - name: Run governance invariant tests
        run: node tests/governance-invariants.mjs

      - name: Run assessment validation
        run: node tests/assessment.mjs

      - name: Run assessment scoring validation
        run: node tests/assessment-scoring.mjs

      - name: Validate local usability session reports
        run: node tests/session-report.mjs

      - name: Validate local report aggregation
        run: node tests/report-aggregator.mjs

      - name: Validate internal test presets
        run: node tests/test-presets.mjs

      - name: Validate simulator command coverage
        run: node tests/command-coverage.mjs
